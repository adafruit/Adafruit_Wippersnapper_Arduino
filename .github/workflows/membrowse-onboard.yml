name: Onboard to Membrowse

on:
  workflow_dispatch:
    inputs:
      num_commits:
        description: 'Number of commits to process'
        required: true
        default: '10'
        type: string

jobs:
  load-targets:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Load target matrix
        id: set-matrix
        run: echo "matrix=$(jq -c '.' .github/membrowse-targets.json)" >> $GITHUB_OUTPUT

  onboard:
    name: onboard (${{ matrix.target_name }})
    needs: load-targets
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.load-targets.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      # Sets up the same arduino-cli toolchain, cores and libraries as the
      # matrix.ci_job job in build-clang-doxy.yml by building HEAD once.
      # Tools live outside the checkout because onboarding runs
      # `git clean -fdx` before building each commit.
      - name: Prepare arduino-cli build
        id: setup
        env:
          CI_BOARD: ${{ matrix.ci_board }}
          CI_JOB: ${{ matrix.ci_job }}
          LD_PATTERN: ${{ matrix.ld }}
        run: |
          set -euo pipefail
          TOOLS="$RUNNER_TEMP/ws-tools"
          git clone --quiet --depth 1 --branch ci-wippersnapper \
            https://github.com/adafruit/ci-arduino.git "$TOOLS/ci"
          # actions_install.sh installs arduino-cli into $GITHUB_WORKSPACE/bin.
          (cd "$TOOLS" && GITHUB_WORKSPACE="$TOOLS" bash ci/actions_install.sh)

          # Same extra libraries as the CI build job.
          yq -r ".jobs[\"$CI_JOB\"].steps[]
                 | select((.name // \"\") | test(\"^Install extra Arduino librar\"))
                 | .run" .github/workflows/build-clang-doxy.yml | bash -e

          wget -q -O- https://jpa.kapsi.fi/nanopb/download/nanopb-0.4.9.2.tar.gz | tar -xz -C "$TOOLS"
          FQBN=$(python3 -c "import sys; sys.path.insert(0, sys.argv[1]); \
            from all_platforms import ALL_PLATFORMS; print(ALL_PLATFORMS[sys.argv[2]][0])" \
            "$TOOLS/ci" "$CI_BOARD")
          echo "NANOPB=$TOOLS/nanopb" >> "$GITHUB_ENV"
          echo "FQBN=$FQBN" >> "$GITHUB_ENV"

          cp "$TOOLS"/nanopb/pb_common.* "$TOOLS"/nanopb/pb_encode.* "$TOOLS"/nanopb/pb_decode.* src/nanopb/
          cp "$TOOLS/nanopb/pb.h" src/nanopb/nanopb.pb.h
          PATH="$TOOLS/bin:$PATH" python3 "$TOOLS/ci/build_platform.py" "$CI_BOARD" --build_timeout 48000

          # Resolved after the build: RP2040 and ESP8266 scripts are generated by it.
          ld=$(ls ${LD_PATTERN/#\~/$HOME})
          echo "ld=$ld" >> "$GITHUB_OUTPUT"

      - name: Run Membrowse Onboard Action
        uses: membrowse/membrowse-action/onboard-action@v1
        with:
          target_name: ${{ matrix.target_name }}
          num_commits: ${{ github.event.inputs.num_commits }}
          # Runs from the checkout root under /bin/sh for each commit.
          build_script: >-
            cp "$NANOPB"/pb_common.* "$NANOPB"/pb_encode.* "$NANOPB"/pb_decode.* src/nanopb/ &&
            cp "$NANOPB/pb.h" src/nanopb/nanopb.pb.h &&
            arduino-cli compile --warnings all --fqbn "$FQBN" --output-dir membrowse-build
            examples/Wippersnapper_demo
          elf: membrowse-build/Wippersnapper_demo.ino.elf
          ld: ${{ steps.setup.outputs.ld }}
          skip_sections: ${{ matrix.skip_sections }}
          api_key: ${{ secrets.MEMBROWSE_API_KEY }}
          api_url: ${{ vars.MEMBROWSE_API_URL }}
