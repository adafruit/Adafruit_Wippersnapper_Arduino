#
# Release pipeline for the migrate-api-v2 (API v2) branch, per
# https://github.com/adafruit/Adafruit_Wippersnapper_Arduino/issues/938
#
# IO trusts the `release: published` webhook, so a v2 release must only be
# published once every firmware asset is attached to it:
#   1. (Optional) Draft the release in the GitHub UI: new tag (e.g.
#      2.0.0-alpha.1), target migrate-api-v2, write the notes, then
#      "Save draft" -- do NOT press "Publish release".
#   2. Dispatch this workflow on the migrate-api-v2 ref with that tag:
#        gh workflow run release-migrate-api-v2.yml --ref migrate-api-v2 -f tag=2.0.0-alpha.1
#      (no draft for the tag yet? one is created with generated notes)
#   3. It tags the draft's target commit, builds every board from that tag
#      via build-migrate-api-v2.yml, attaches the assets to the draft and
#      publishes it.
#
# GitHub never runs workflows for a draft release's `created` event, hence
# the manual dispatch. Publishing with GITHUB_TOKEN still delivers the repo
# webhook to IO, but does not start any other `release: published` workflow.
name: Release (migrate-api-v2 branch)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. 2.0.0-alpha.1 (uses the draft release for this tag, or creates one)"
        required: true
      target:
        description: "Branch or SHA to tag when neither the tag nor a draft for it exists yet"
        required: false
        default: migrate-api-v2
      prerelease:
        description: "Publish as a pre-release"
        type: boolean
        default: true
      make_latest:
        description: "Mark as the Latest release (leave off while v1 is the current line)"
        type: boolean
        default: false
      publish:
        description: "Publish once the assets are attached (off = leave the draft for review)"
        type: boolean
        default: true
  # Only reached when someone publishes a v2 release by hand (the pipeline
  # publishes with GITHUB_TOKEN, which does not trigger workflows).
  release:
    types: [published]
  # No-op run (every job is skipped) so GitHub registers this workflow, which
  # is not on the default branch, and accepts dispatches for it.
  pull_request:
    paths:
      - .github/workflows/release-migrate-api-v2.yml

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 📝 Prepare draft release
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      TARGET: ${{ inputs.target }}
    steps:
      - name: Validate tag
        run: |
          if [[ ! "$TAG" =~ ^2\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$TAG' is not a v2 semver tag (expected 2.x.y or 2.x.y-pre.n)"
            exit 1
          fi
      - name: Find or create the draft release
        id: draft
        run: |
          find_release() {
            gh api "repos/$GH_REPO/releases" --paginate \
              --jq ".[] | select(.tag_name == \"$TAG\") | {id, draft, target_commitish}" | head -n1
          }
          release=$(find_release)
          if [ -z "$release" ]; then
            # Generate notes from the previous v2 release, not v1's latest
            prev=$(gh api "repos/$GH_REPO/releases" --paginate \
              --jq '.[] | select(.draft | not) | select(.tag_name | startswith("2.")) | .tag_name' | head -n1)
            echo "No draft release for $TAG; creating one from $TARGET (notes since ${prev:-the first commit})"
            gh release create "$TAG" --draft --target "$TARGET" --title "$TAG" \
              --generate-notes ${prev:+--notes-start-tag "$prev"}
            release=$(find_release)
          fi
          echo "$release"
          if [ "$(jq -r .draft <<<"$release")" != "true" ]; then
            echo "::error::Release $TAG is already published; this workflow only publishes drafts"
            exit 1
          fi
          echo "id=$(jq -r .id <<<"$release")" >> "$GITHUB_OUTPUT"
          echo "target=$(jq -r .target_commitish <<<"$release")" >> "$GITHUB_OUTPUT"
      - name: Tag the draft's target commit
        id: tag
        env:
          RELEASE_ID: ${{ steps.draft.outputs.id }}
          DRAFT_TARGET: ${{ steps.draft.outputs.target }}
        run: |
          # A draft's tag is normally only created on publish, but the build
          # needs it now so `git describe` (WS_VERSION) reports the release.
          if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
            sha=$(gh api "repos/$GH_REPO/commits/tags/$TAG" --jq .sha)
            echo "Tag $TAG already exists at $sha"
          else
            sha=$(gh api "repos/$GH_REPO/commits/$DRAFT_TARGET" --jq .sha)
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$TAG" -f sha="$sha" > /dev/null
            echo "Created tag $TAG at $sha ($DRAFT_TARGET)"
          fi
          # Pin the draft to the built commit, not wherever the branch moves to
          gh api -X PATCH "repos/$GH_REPO/releases/$RELEASE_ID" -f target_commitish="$sha" > /dev/null
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  build:
    name: 🏗️ Build
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/build-migrate-api-v2.yml
    with:
      ref: refs/tags/${{ inputs.tag }}
    secrets: inherit

  publish:
    name: 🚀 Attach assets and publish
    needs: [prepare, build]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Download build artifacts from build-platform steps
        uses: actions/download-artifact@v8
        with:
          name: build-files
          path: build-files
      - name: List Files
        run: ls -la build-files
      - name: Upload Assets to the draft release
        run: |
          shopt -s nullglob
          files=(build-files/wippersnapper.*.uf2 build-files/wippersnapper.*.bin build-files/wippersnapper.*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware assets found in build-files; not publishing $TAG"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
          echo "Attached ${#files[@]} assets to $TAG"
      - name: Publish the release
        if: inputs.publish
        run: |
          gh release edit "$TAG" --draft=false \
            --prerelease=${{ inputs.prerelease }} --latest=${{ inputs.make_latest }}
          echo "Published $TAG (commit ${{ needs.prepare.outputs.sha }})"

  manual-publish-guard:
    name: 🛑 Check manually published release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    steps:
      - name: Fail if the release was published without assets
        run: |
          count=$(jq '.release.assets | length' "$GITHUB_EVENT_PATH")
          if [ "$count" -eq 0 ]; then
            echo "::error::${{ github.event.release.tag_name }} was published without firmware assets, and IO has already been sent its release webhook."
            echo "::error::Convert it back to a draft (gh release edit ${{ github.event.release.tag_name }} --draft=true), then run release-migrate-api-v2.yml with that tag."
            exit 1
          fi
          echo "${{ github.event.release.tag_name }} was published with $count assets"
